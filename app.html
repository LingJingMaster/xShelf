<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>xShelf · 本地 X 资料库</title>
  <link rel="stylesheet" href="src/app.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand-row">
        <a class="brand" href="app.html" aria-label="xShelf 首页"><span>x</span>Shelf</a>
        <button class="icon-button mobile-only" id="closeNav" aria-label="关闭目录">×</button>
      </div>
      <button class="sync-card" id="syncButton">
        <span class="sync-light" id="syncLight"></span>
        <span><b id="syncLabel">连接 X</b><small id="syncMeta">等待 X 页面请求</small></span>
      </button>
      <nav class="primary-nav" id="categoryNav" aria-label="用户关系">
        <div class="group-label">用户关系</div>
        <button class="nav-item" data-category="following"><span>正在关注</span><small data-count="following">0</small></button>
        <button class="nav-item" data-category="blocked"><span>已屏蔽</span><small data-count="blocked">0</small></button>
      </nav>
      <div class="tag-head"><span>标签</span><span class="tag-head-actions"><button id="manageTags" type="button">管理</button><button id="newTag" type="button" aria-label="新建标签">＋</button></span></div>
      <nav id="tagList" class="tag-list" aria-label="标签"></nav>
      <div class="sidebar-foot">
        <button class="text-button" id="themeButton" type="button" aria-pressed="false">深色模式</button>
        <button class="text-button" id="importButton">导入资料</button>
        <button class="text-button" id="backupButton">备份与恢复</button>
        <button class="text-button danger-text" id="clearButton" type="button">清空所有数据</button>
        <p>只存于这台浏览器</p>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-button mobile-only" id="openNav" aria-label="打开目录">☰</button>
        <nav class="content-tabs" id="contentTabs" aria-label="内容类型">
          <button class="active" data-category="like"><span>喜欢</span><small data-count="like">0</small></button>
          <button data-category="bookmark"><span>书签</span><small data-count="bookmark">0</small></button>
          <button data-category="post"><span>推文</span><small data-count="post">0</small></button>
          <button data-category="reply"><span>回复</span><small data-count="reply">0</small></button>
        </nav>
        <label class="search-field">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" autocomplete="off" placeholder="搜索文字、短语，或试试 claude and code">
          <kbd>/</kbd>
        </label>
      </header>

      <section class="shelf-head">
        <div class="shelf-tools">
          <div class="view-switch" role="group" aria-label="视图">
          <button data-view="compact" aria-pressed="true" title="紧凑视图">☷</button>
          <button data-view="gallery" aria-pressed="false" title="媒体画廊">▦</button>
          <button data-view="stats" aria-pressed="false" title="统计视图">◒</button>
          </div>
          <button class="quiet-button" id="filterButton">筛选 <span id="filterCount"></span></button>
          <button class="quiet-button" id="batchTagButton" type="button" disabled>批量标签</button>
          <button class="ink-button" id="exportButton">导出</button>
          <button class="delete-selected" id="deleteSelected" type="button" disabled>删除</button>
        </div>
      </section>

      <div class="notice hidden" id="notice"></div>
      <section id="stage" class="card-grid" aria-live="polite"></section>
    </main>
  </div>

  <dialog id="tagCreateDialog">
    <form class="dialog-card" id="tagCreateForm">
      <div class="dialog-head"><div><p>整理本地资料</p><h2>新建标签</h2></div><button class="icon-button" type="submit" value="cancel" aria-label="关闭">×</button></div>
      <label class="field-stack" for="tagName">
        <span>标签名称</span>
        <input id="tagName" name="name" type="text" maxlength="24" autocomplete="off" placeholder="例如：待读、工具、灵感">
        <small>同一条内容可以添加多个标签。</small>
        <strong class="field-error" id="tagCreateError" role="alert"></strong>
      </label>
      <div class="dialog-actions"><button class="quiet-button" type="submit" value="cancel">取消</button><button class="ink-button" type="submit" value="create">创建标签</button></div>
    </form>
  </dialog>

  <dialog id="filterDialog">
    <form method="dialog" class="dialog-card" id="filterForm">
      <div class="dialog-head"><div><p>缩小范围</p><h2>筛选内容</h2></div><button class="icon-button" value="cancel" aria-label="关闭">×</button></div>
      <div class="form-grid">
        <label>内容类型<select name="contentType"><option value="all">全部</option><option value="image">图片</option><option value="video">视频</option><option value="gif">GIF</option><option value="article">文章</option></select></label>
        <label>帖子类型<select name="postType"><option value="all">全部</option><option value="post">普通帖子</option><option value="reply">回复</option><option value="quote">引用</option><option value="repost">转帖</option></select></label>
        <label>开始日期<input name="startDate" type="date"></label>
        <label>结束日期<input name="endDate" type="date"></label>
        <label class="check-row"><input name="oldest" type="checkbox"> 最早的排在前面</label>
      </div>
      <div class="dialog-actions"><button class="quiet-button" id="clearFilters" type="button">清除</button><button class="ink-button" value="apply">应用筛选</button></div>
    </form>
  </dialog>

  <dialog id="exportDialog">
    <form method="dialog" class="dialog-card">
      <div class="dialog-head"><div><p id="exportScope">带走你的资料</p><h2 id="exportTitle">导出当前范围</h2></div><button class="icon-button" value="cancel" aria-label="关闭">×</button></div>
      <div class="choice-list">
        <button type="button" data-export="markdown"><b>Markdown</b><span>保留正文、原链接和附图，适合笔记软件</span></button>
        <button type="button" data-export="json"><b>JSON</b><span>完整字段，适合迁移和再处理</span></button>
        <button type="button" data-export="csv"><b>CSV</b><span>适合电子表格</span></button>
        <button type="button" data-export="html"><b>HTML</b><span>无需扩展也能打开的阅读页</span></button>
      </div>
    </form>
  </dialog>

  <dialog id="backupDialog">
    <form method="dialog" class="dialog-card">
      <div class="dialog-head"><div><p>本地副本</p><h2>备份与恢复</h2></div><button class="icon-button" value="cancel" aria-label="关闭">×</button></div>
      <p class="explain">备份是 ZIP 文件，里面保存明文 JSONL。请把它放在你信任的位置。</p>
      <div class="split-actions"><button class="ink-button" type="button" id="createBackup">下载备份</button><label class="quiet-button file-label">恢复备份<input id="restoreInput" type="file" accept=".zip,application/zip"></label></div>
    </form>
  </dialog>

  <dialog id="manageTagsDialog">
    <form method="dialog" class="dialog-card">
      <div class="dialog-head"><div><p>重命名或删除本地标签</p><h2>管理标签</h2></div><button class="icon-button" value="cancel" aria-label="关闭">×</button></div>
      <div class="tag-manager-list" id="tagManagerList"></div>
      <div class="dialog-actions"><button class="ink-button" value="cancel">完成</button></div>
    </form>
  </dialog>

  <dialog id="editTagsDialog">
    <form method="dialog" class="dialog-card">
      <div class="dialog-head"><div><p>一条内容可拥有多个标签</p><h2>编辑标签</h2></div><button class="icon-button" value="cancel" aria-label="关闭">×</button></div>
      <div class="tag-composer">
        <input id="editTagName" type="text" maxlength="24" autocomplete="off" placeholder="输入新标签">
        <button class="quiet-button" id="createEditTag" type="button">创建</button>
        <strong class="field-error" id="editTagError" role="alert"></strong>
      </div>
      <div class="tag-choice-list" id="editTagChoices"></div>
      <div class="dialog-actions"><button class="quiet-button" value="cancel">取消</button><button class="ink-button" id="saveTags" type="button">保存标签</button></div>
    </form>
  </dialog>

  <dialog id="batchTagsDialog">
    <form method="dialog" class="dialog-card">
      <div class="dialog-head"><div><p id="batchTagCopy">修改已选内容</p><h2>批量标签</h2></div><button class="icon-button" value="cancel" aria-label="关闭">×</button></div>
      <div class="tag-composer">
        <input id="batchTagName" type="text" maxlength="24" autocomplete="off" placeholder="输入新标签">
        <button class="quiet-button" id="createBatchTag" type="button">创建</button>
        <strong class="field-error" id="batchTagError" role="alert"></strong>
      </div>
      <div class="tag-choice-list" id="batchTagChoices"></div>
      <div class="dialog-actions"><button class="quiet-button" value="cancel">取消</button><button class="quiet-button" id="removeBatchTags" type="button" disabled>移除标签</button><button class="ink-button" id="addBatchTags" type="button" disabled>添加标签</button></div>
    </form>
  </dialog>

  <dialog id="deleteDialog">
    <form method="dialog" class="dialog-card">
      <div class="dialog-head"><div><p>仅删除本地副本</p><h2>删除已选内容</h2></div><button class="icon-button" value="cancel" aria-label="关闭">×</button></div>
      <p class="danger-copy" id="deleteSelectedCopy"></p>
      <div class="dialog-actions"><button class="quiet-button" value="cancel">取消</button><button class="danger-button" id="confirmDeleteSelected" type="button">确认删除</button></div>
    </form>
  </dialog>

  <dialog id="clearDialog">
    <form method="dialog" class="dialog-card">
      <div class="dialog-head"><div><p>危险操作</p><h2>清空本地资料库</h2></div><button class="icon-button" value="cancel" aria-label="关闭">×</button></div>
      <p class="danger-copy" id="clearWarning">所有数据都会被清空。书签、喜欢、推文、回复、正在关注和已屏蔽都会从这台浏览器删除，而且不能撤销。</p>
      <p class="danger-copy" id="clearFinal" hidden>这是最后一次确认。点击“确认清空”后，本地资料会立即永久删除。</p>
      <div class="dialog-actions"><button class="quiet-button" value="cancel">取消</button><button class="danger-button" id="confirmClear" type="button">我已了解风险</button></div>
    </form>
  </dialog>

  <input id="importInput" type="file" accept=".json,.jsonl,.zip,application/json,application/zip" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="src/vendor/fflate.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
